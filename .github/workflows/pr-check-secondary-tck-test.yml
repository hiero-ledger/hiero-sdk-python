name: Secondary PR Check - TCK Unit Test

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "tck/**"
      - "tests/tck/**"
  pull_request:
    paths:
      - "src/**"
      - "tck/**"
      - "tests/tck/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tck-unit-test:
    name: TCK Unit Test
    runs-on: hl-sdk-py-lin-md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages --all-extras

      - name: Generate Proto Files
        run: uv run generate_proto.py

      - name: Run unit tests
        run: |
          uv run pytest tests/tck -v
