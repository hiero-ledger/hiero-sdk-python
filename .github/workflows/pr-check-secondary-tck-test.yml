name: Secondary PR Check - TCK Test

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "tck/**"
      - "tests/tck/**"
  pull_request:
    paths:
      - "src/**"
      - "tck/**"
      - "tests/tck/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tck-unit-test:
    name: TCK Unit Test
    runs-on: hl-sdk-py-lin-md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages --all-extras

      - name: Generate Proto Files
        run: uv run generate_proto.py

      - name: Run unit tests
        run: |
          uv run pytest tests/tck -v

  tck-compatiblity:
    runs-on: ubuntu-latest
    name: TCK Compatiblity Check
    timeout-minutes: 45

    steps:
      - name: Harden runner (audit outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Hiero Solo
        uses: hiero-ledger/hiero-solo-action@c5326debc5b38e50fa4032361c0a35f46166c0e7 # v0.25.0
        with:
          installMirrorNode: true

      - name: Run Hiero TCK
        uses: hiero-hackers/hiero-tck-action@71c05203834ed80c5897a387c44a25ab215b3efe #v0.0.1
        with:
          sdk: python
