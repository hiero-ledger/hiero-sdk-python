name: TCk Compatiblity Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tck-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (audit outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Hiero Solo
        uses: hiero-ledger/hiero-solo-action@c5326debc5b38e50fa4032361c0a35f46166c0e7 # v0.25.0
        with:
          installMirrorNode: true

      - name: Run Hiero TCK
        uses: hiero-hackers/hiero-tck-action@main
        with:
          sdk: python
