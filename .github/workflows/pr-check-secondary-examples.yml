name: Secondary PR Check - Examples
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "generate_proto.py"
      - ".github/scripts/pr-check-secondary-examples.js"
      - ".github/scripts/__tests__/pr-check-secondary-examples.test.js"
      - ".github/scripts/jest.config.js"
      - ".github/scripts/package.json"
      - ".github/workflows/pr-check-secondary-examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "generate_proto.py"
      - ".github/scripts/pr-check-secondary-examples.js"
      - ".github/scripts/__tests__/pr-check-secondary-examples.test.js"
      - ".github/scripts/jest.config.js"
      - ".github/scripts/package.json"
      - ".github/workflows/pr-check-secondary-examples.yml"
  workflow_dispatch:

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-examples:
    runs-on: ${{ (github.repository_owner != 'hiero-ledger' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'hl-sdk-py-lin-md' }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-packages --all-extras

      - name: Test script
        run: npm test
        working-directory: .github/scripts

      - name: Generate Proto Files
        run: uv run python generate_proto.py

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # v0.26.0
        with:
          installMirrorNode: true
          soloVersion: v0.91.0
          mirrorNodeVersion: v0.153.0
          hieroVersion: v0.76.1

      - name: Run Examples
        env:
          OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
          OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
          CHAIN_ID: 012A
          NETWORK: solo
        run: node .github/scripts/pr-check-secondary-examples.js
