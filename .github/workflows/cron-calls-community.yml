name: PythonBot - Community Call Reminder

on:
    schedule:
        - cron: "0 10 * * 3"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Run in dry mode (no comments will be posted)"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

permissions:
    contents: read
    issues: write

concurrency:
    group: community-call-reminder
    cancel-in-progress: false

jobs:
    office-hour-reminder:
        runs-on: hl-sdk-py-lin-md
        steps:
            - name: Harden the runner
              uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check Schedule and Notify
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
              run: |
                  bash .github/scripts/cron-calls-community.sh
