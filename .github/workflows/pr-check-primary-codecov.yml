name: Primary PR Check - Code-coverage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/unit/**"
      - ".github/workflows/pr-check-primary-codecov.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/unit/**"
      - ".github/workflows/pr-check-primary-codecov.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: hl-sdk-py-lin-md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-packages --all-extras

      - name: Generate Proto Files
        run: uv run python generate_proto.py

      - name: Run unit tests and generate coverage report
        run: |
          uv run pytest tests/unit \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: github.repository_owner == 'hiero-ledger'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
